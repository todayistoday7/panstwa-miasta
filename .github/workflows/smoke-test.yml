name: Smoke Tests

on:
  push:
    branches: [main, master, staging]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        # Fixed version: a new Playwright release once broke this step (Nov 2026)
        run: npm install playwright@1.64.0

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Wait for Railway deployment
        # Railway needs ~1-3 min to build and restart; testing too early tests the OLD version
        run: sleep 180

      - name: Run smoke tests
        # staging branch → staging site, main → production
        run: node smoke-test.js ${{ github.ref_name == 'staging' && 'https://magnificent-reverence-production.up.railway.app' || 'https://panstwamiastagra.com' }}
